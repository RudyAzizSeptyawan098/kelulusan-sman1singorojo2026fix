<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hasil Kelulusan - SMAN 1 Singorojo</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body {
    height: 100vh;
    margin: 0;
    background: linear-gradient(135deg, #11998e, #38ef7d);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Poppins', sans-serif;
}

.card {
    background: #fff;
    padding: 40px;
    border-radius: 16px;
    text-align: center;
    width: 380px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

/* LOGO */
.logo-img {
    width: 90px;
    margin-bottom: 10px;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
}

.judul {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 20px;
}

.keterangan {
    font-size: 14px;
    color: #444;
    line-height: 1.6;
}

.nama {
    font-size: 20px;
    font-weight: 700;
    margin: 15px 0;
}

.status {
    font-size: 30px;
    font-weight: bold;
    color: #16a34a;
    margin: 10px 0;
}

.tahun {
    font-size: 14px;
    margin-top: 10px;
}

.ucapan {
    font-size: 14px;
    margin-top: 15px;
    color: #555;
    line-height: 1.6;
}

button {
    margin-top: 25px;
    padding: 12px;
    width: 100%;
    border: none;
    border-radius: 8px;
    background: #11998e;
    color: white;
    font-weight: 600;
    cursor: pointer;
}

button:hover {
    background: #0e7c72;
}
</style>
</head>

<body>

<div class="card">

    <!-- LOGO -->
    <img src="smansi_logo.png" class="logo-img">

    <div class="judul">HASIL KELULUSAN</div>

    <div id="hasil">Memuat...</div>

    <button id="btnDownload" onclick="download()">Download Surat Pengumuman Kelulusan</button>
</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const nisn = urlParams.get("nisn");

let linkPDF = null;

async function loadData(){
    let hasil = document.getElementById("hasil");

    try {
        let res = await fetch("https://script.google.com/macros/s/AKfycbz2Ea8ohJhB20hWrTrYW6b7wAMwGIE-RWO75YwMsQLdkanCFQOkPkokbfStDtmeJtfHfw/exec?nisn=" + nisn);
        let text = await res.text();
        let data = JSON.parse(text);

        if(data.status === "ditemukan"){

            let nama = data.nama || "Siswa";
            linkPDF = data.link_pdf;

            let status = "LULUS";

            hasil.innerHTML = `
                <div class="keterangan">
                    Berdasarkan kriteria kelulusan, Rapat Pleno Dewan Guru SMA Negeri 1 Singorojo, menyatakan bahwa:
                </div>

                <div class="nama">${nama.toUpperCase()}</div>

                <div class="status">${status}</div>

                <div class="tahun">
                    dari SMA Negeri 1 Singorojo,<br>
                    Tahun Ajaran 2025/2026.
                </div>

                <div class="ucapan">
                    Selamat kepada <b>${nama}</b>.<br>
                    Semoga keberhasilan ini menjadi langkah awal menuju masa depan yang gemilang.
                </div>
            `;

        } else {
            hasil.innerHTML = "Data tidak ditemukan";
            document.getElementById("btnDownload").style.display = "none";
        }

    } catch(err){
        hasil.innerHTML = "Terjadi error";
        console.log(err);
    }
}

function download(){
    if(linkPDF){
        window.open(linkPDF, "_blank");
    } else {
        alert("Link surat tidak tersedia");
    }
}

loadData();
</script>

</body>
</html>

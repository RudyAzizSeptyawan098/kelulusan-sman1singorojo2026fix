<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hasil Kelulusan - SMAN 1 Singorojo</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body {
    height: 100vh;
    margin: 0;
    background: linear-gradient(135deg, #11998e, #38ef7d);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Poppins', sans-serif;
}

.card {
    background: #fff;
    padding: 35px;
    border-radius: 14px;
    text-align: center;
    width: 340px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

.nama {
    font-weight: 700;
    margin-bottom: 10px;
}

.status {
    font-size: 22px;
    font-weight: bold;
    margin-top: 10px;
}

.lulus { color: #16a34a; }
.tidak { color: #dc2626; }

.ucapan {
    font-size: 13px;
    margin-top: 12px;
    color: #555;
    line-height: 1.5;
}

button {
    margin-top: 20px;
    padding: 12px;
    width: 100%;
    border: none;
    border-radius: 8px;
    background: #11998e;
    color: white;
    font-weight: 600;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="card">
    <h2>HASIL KELULUSAN</h2>
    <div id="hasil">Memuat...</div>
    <button id="btnDownload" onclick="download()">Download Surat Pengumuman Kelulusan</button>
</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const nisn = urlParams.get("nisn");

let linkPDF = null;

// 🔥 fungsi penentu status (ANTI SALAH TOTAL)
function getStatus(raw){
    let s = (raw || "").toString().trim().toUpperCase();

    if(s.includes("LULUS")){
        return "LULUS";
    }

    return "TIDAK LULUS";
}

async function loadData(){
    let hasil = document.getElementById("hasil");

    try {
        let res = await fetch("https://script.google.com/macros/s/AKfycbz2Ea8ohJhB20hWrTrYW6b7wAMwGIE-RWO75YwMsQLdkanCFQOkPkokbfStDtmeJtfHfw/exec?nisn=" + nisn);
        let text = await res.text();
        let data = JSON.parse(text);

        if(data.status === "ditemukan"){

            linkPDF = data.link_pdf;

            let nama = data.nama || "Siswa";

            // 🔥 gunakan fungsi aman
            let status = getStatus(data.kelulusan);

            let statusClass = status === "LULUS" ? "lulus" : "tidak";

            let ucapan = status === "LULUS"
                ? `Selamat kepada <b>${nama}</b>. Berdasarkan hasil rapat dewan guru SMA Negeri 1 Singorojo, Anda dinyatakan <b>LULUS</b>. Semoga sukses ke jenjang berikutnya.`
                : `Kepada <b>${nama}</b>, berdasarkan hasil rapat dewan guru SMA Negeri 1 Singorojo, Anda dinyatakan <b>TIDAK LULUS</b>. Tetap semangat dan terus berusaha.`;

            hasil.innerHTML = `
                <div class="nama">${nama}</div>
                <div class="status ${statusClass}">${status}</div>
                <div class="ucapan">${ucapan}</div>
            `;

        } else {
            hasil.innerHTML = "Data tidak ditemukan";
            document.getElementById("btnDownload").style.display = "none";
        }

    } catch(err){
        hasil.innerHTML = "Terjadi error";
        console.log(err);
    }
}

function download(){
    if(linkPDF){
        window.open(linkPDF, "_blank");
    } else {
        alert("Link surat tidak tersedia");
    }
}

loadData();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verifikasi Data - SMAN 1 Singorojo</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
    height: 100vh;
    background: linear-gradient(135deg, #2f80ed, #56ccf2);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Poppins', sans-serif;
}

.card {
    background: #fff;
    padding: 30px;
    border-radius: 12px;
    text-align: center;
    width: 330px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

.nama {
    font-weight: 600;
    color: #2f80ed;
    margin-bottom: 15px;
}

input, button {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    border-radius: 8px;
    border: none;
}

button {
    background: #2f80ed;
    color: white;
    cursor: pointer;
}

#msg {
    margin-top: 10px;
    color: red;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="card">
    <h2>Verifikasi Data</h2>

    <div id="nama" class="nama">Memuat data...</div>
    <p>Silakan masukkan tanggal lahir Anda</p>

    <form onsubmit="verifikasi(event)">
        <input type="date" id="tgl" required>
        <button type="submit">Verifikasi</button>
    </form>

    <div id="msg"></div>
</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const nisn = urlParams.get("nisn");

let dataSiswa = null;

// 🔹 Ambil data dari API
async function loadData(){
    let namaDiv = document.getElementById("nama");

    try {
        let res = await fetch("https://script.google.com/macros/s/AKfycbz2Ea8ohJhB20hWrTrYW6b7wAMwGIE-RWO75YwMsQLdkanCFQOkPkokbfStDtmeJtfHfw/exec?nisn=" + nisn);
        let text = await res.text();
        let data = JSON.parse(text);

        if(data.status === "ditemukan"){
            dataSiswa = data;
            namaDiv.innerHTML = "Selamat datang,<br><b>" + data.nama + "</b>";
        } else {
            namaDiv.innerHTML = "Data tidak ditemukan";
        }

    } catch(err){
        namaDiv.innerHTML = "Gagal mengambil data";
        console.log(err);
    }
}

// 🔹 Verifikasi tanggal lahir (SUDAH FIX FORMAT)
function verifikasi(e){
    e.preventDefault();

    let input = document.getElementById("tgl").value; // format dari browser
    let msg = document.getElementById("msg");

    if(!dataSiswa){
        msg.innerHTML = "Data belum siap";
        return;
    }

    msg.innerHTML = "Memverifikasi...";

    // 🔥 SAMAKAN FORMAT DENGAN GOOGLE SHEETS (YYYY-MM-DD)
    let d = new Date(input);
    let yyyy = d.getFullYear();
    let mm = String(d.getMonth() + 1).padStart(2, '0');
    let dd = String(d.getDate()).padStart(2, '0');

    let inputFix = `${yyyy}-${mm}-${dd}`;

    console.log("Input:", inputFix);
    console.log("API:", dataSiswa.tgl_lahir);

    if(dataSiswa.tgl_lahir === inputFix){
        window.location.href = "final.html?nisn=" + nisn;
    } else {
        msg.innerHTML = "Tanggal lahir tidak sesuai!";
    }
}

loadData();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verifikasi Data - SMAN 1 Singorojo</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
    height: 100vh;
    margin: 0;
    background: linear-gradient(135deg, #2f80ed, #56ccf2);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Poppins', sans-serif;
}

.card {
    background: #fff;
    padding: 30px;
    border-radius: 12px;
    text-align: center;
    width: 340px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

.nama {
    color: #2f80ed;
    font-weight: 600;
    margin-bottom: 15px;
}

.desc {
    font-size: 13px;
    color: #555;
    margin-bottom: 15px;
}

input, button {
    width: 100%;
    padding: 11px;
    margin-top: 10px;
    border-radius: 8px;
    border: none;
}

input {
    background: #f2f2f2;
    text-align: center;
    letter-spacing: 1px;
}

button {
    background: #2f80ed;
    color: white;
    font-weight: 600;
    cursor: pointer;
}

#msg {
    margin-top: 10px;
    color: red;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="card">
    <h2>Verifikasi Data</h2>

    <div id="nama" class="nama">Memuat data...</div>

    <div class="desc">
        Masukkan tanggal lahir Anda <br>
        <b>(Format: YYYY-MM-DD)</b>
    </div>

    <form onsubmit="verifikasi(event)">
        <input type="text" id="tgl" placeholder="Contoh: 2008-02-16" required>
        <button type="submit">Verifikasi</button>
    </form>

    <div id="msg"></div>
</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const nisn = urlParams.get("nisn");

let dataSiswa = null;

// 🔥 normalisasi tanggal (anti beda format)
function normalize(dateStr){
    let d = new Date(dateStr);
    if(isNaN(d)) return null;

    let y = d.getFullYear();
    let m = String(d.getMonth()+1).padStart(2,'0');
    let day = String(d.getDate()).padStart(2,'0');

    return `${y}-${m}-${day}`;
}

// ambil data dari API
async function loadData(){
    let namaDiv = document.getElementById("nama");

    try {
        let res = await fetch("https://script.google.com/macros/s/AKfycbz2Ea8ohJhB20hWrTrYW6b7wAMwGIE-RWO75YwMsQLdkanCFQOkPkokbfStDtmeJtfHfw/exec?nisn=" + nisn);
        let text = await res.text();
        let data = JSON.parse(text);

        if(data.status === "ditemukan"){
            dataSiswa = data;
            namaDiv.innerHTML = "Selamat datang,<br><b>" + data.nama + "</b>";
        } else {
            namaDiv.innerHTML = "Data tidak ditemukan";
        }

    } catch(err){
        namaDiv.innerHTML = "Gagal mengambil data";
        console.log(err);
    }
}

// verifikasi
function verifikasi(e){
    e.preventDefault();

    let input = document.getElementById("tgl").value.trim();
    let msg = document.getElementById("msg");

    if(!dataSiswa){
        msg.innerHTML = "Data belum siap";
        return;
    }

    // 🔥 validasi format manual
    if(!/^\d{4}-\d{2}-\d{2}$/.test(input)){
        msg.innerHTML = "Format harus YYYY-MM-DD!";
        return;
    }

    let inputFix = normalize(input);
    let apiFix = normalize(dataSiswa.tanggal_lahir);

    console.log("INPUT:", inputFix);
    console.log("API:", apiFix);

    msg.innerHTML = "Memverifikasi...";

    if(inputFix === apiFix){
        window.location.href = "final.html?nisn=" + nisn;
    } else {
        msg.innerHTML = "Tanggal lahir tidak sesuai!";
    }
}

loadData();
</script>

</body>
</html>

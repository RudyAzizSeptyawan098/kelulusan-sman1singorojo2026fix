<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verifikasi</title>

<style>
body {
    height: 100vh;
    background: linear-gradient(135deg, #2f80ed, #56ccf2);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: sans-serif;
}
.card {
    background: #fff;
    padding: 30px;
    border-radius: 10px;
    text-align: center;
}
input, button {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
}
#msg {
    margin-top: 10px;
    color: red;
}
</style>
</head>

<body>

<div class="card">
    <h2>Verifikasi Data</h2>
    <p>Masukkan Tanggal Lahir</p>

    <form onsubmit="verifikasi(event)">
        <input type="date" id="tgl" required>
        <button type="submit">Cek</button>
    </form>

    <div id="msg"></div>
</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const nisn = urlParams.get("nisn");

async function verifikasi(e){
    e.preventDefault();

    let tgl = document.getElementById("tgl").value;
    let msg = document.getElementById("msg");

    msg.innerHTML = "Memverifikasi...";

    try {
        let res = await fetch("https://script.google.com/macros/s/AKfycbz2Ea8ohJhB20hWrTrYW6b7wAMwGIE-RWO75YwMsQLdkanCFQOkPkokbfStDtmeJtfHfw/exec?nisn=" + nisn);
        let data = await res.json();

        if(data.status === "ditemukan"){
            if(data.tgl_lahir === tgl){
                window.location.href = "final.html?nisn=" + nisn;
            } else {
                msg.innerHTML = "Tanggal lahir tidak sesuai!";
            }
        } else {
            msg.innerHTML = "Data tidak ditemukan!";
        }

    } catch(err){
        msg.innerHTML = "Terjadi error";
    }
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cek Kelulusan</title>

<style>
body {
    height: 100vh;
    background: linear-gradient(135deg, #1e5bb8, #2f80ed);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: sans-serif;
}
.card {
    background: #fff;
    padding: 30px;
    border-radius: 10px;
    text-align: center;
}
input, button {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
}
</style>
</head>

<body>

<div class="card">
    <h2>PENGUMUMAN KELULUSAN</h2>
    <form onsubmit="lanjut(event)">
        <input type="text" id="nisn" placeholder="Masukkan NISN" required>
        <button type="submit">Lanjut</button>
    </form>
</div>

<script>
function lanjut(e){
    e.preventDefault();
    let nisn = document.getElementById("nisn").value;
    window.location.href = "hasil.html?nisn=" + nisn;
}
</script>

</body>
</html>

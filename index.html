<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pengumuman Kelulusan - SMA Negeri 1 Singorojo</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    display: flex;
    justify-content: center;
    align-items: center;
}

/* CARD */
.card {
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(12px);
    border-radius: 16px;
    padding: 40px 30px;
    width: 350px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    border: 1px solid rgba(255,255,255,0.2);
}

/* LOGO */
.logo-img {
    width: 80px;
    margin-bottom: 10px;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
}

/* HEADER */
.logo {
    font-size: 18px;
    font-weight: 600;
    color: #fff;
    margin-bottom: 5px;
}

h2 {
    color: #fff;
    margin-bottom: 4px;
}

.sub {
    font-size: 13px;
    color: #ddd;
    margin-bottom: 20px;
}

.desc {
    font-size: 13px;
    color: #ccc;
    margin-bottom: 10px;
}

/* TIMER */
.timer {
    font-size: 14px;
    color: #ffcc00;
    margin-bottom: 15px;
}

/* INPUT */
input {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: none;
    margin-top: 10px;
    font-size: 14px;
    text-align: center;
}

/* BUTTON */
button {
    width: 100%;
    padding: 12px;
    margin-top: 15px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(135deg, #56ccf2, #2f80ed);
    color: white;
    font-weight: 600;
    cursor: pointer;
}

button:disabled {
    background: gray;
    cursor: not-allowed;
}

/* ERROR */
.error {
    margin-top: 10px;
    color: #ff6b6b;
    font-size: 13px;
}

/* FOOTER */
.footer {
    margin-top: 20px;
    font-size: 11px;
    color: #aaa;
}
</style>
</head>

<body>

<div class="card">

    <img src="smansi_logo.png" class="logo-img">

    <div class="logo">PENGUMUMAN KELULUSAN</div>

    <h2>SMA NEGERI 1 SINGOROJO</h2>
    <div class="sub">Tahun Ajaran 2025/2026</div>

    <p class="desc">Silakan masukkan NISN untuk melihat hasil kelulusan Anda</p>

    <div id="timer" class="timer"></div>

    <form onsubmit="lanjut(event)">
        <input type="text" id="nisn" placeholder="Masukkan NISN" required disabled>
        <button type="submit" id="btn" disabled>Cek Kelulusan</button>
    </form>

    <div id="error" class="error"></div>

    <div class="footer">
        © 2026 SMAN 1 Singorojo
    </div>

</div>

<script>
const target = new Date("2026-05-04T18:00:00+07:00");

const timerEl = document.getElementById("timer");
const btn = document.getElementById("btn");
const input = document.getElementById("nisn");

// TIMER
function updateTimer(){
    const now = new Date();
    const selisih = target - now;

    if(selisih <= 0){
        timerEl.innerHTML = "Pengumuman sudah dibuka";
        btn.disabled = false;
        input.disabled = false;
        return;
    }

    const hari = Math.floor(selisih / (1000 * 60 * 60 * 24));
    const jam = Math.floor((selisih / (1000 * 60 * 60)) % 24);
    const menit = Math.floor((selisih / (1000 * 60)) % 60);
    const detik = Math.floor((selisih / 1000) % 60);

    timerEl.innerHTML = 
        "Pengumuman dibuka dalam:<br>" +
        `${hari} hari ${jam} jam ${menit} menit ${detik} detik`;

    setTimeout(updateTimer, 1000);
}

updateTimer();

// VALIDASI + CEK DATABASE
async function lanjut(e){
    e.preventDefault();

    let nisn = input.value.trim();
    let error = document.getElementById("error");

    // validasi kosong
    if(nisn === ""){
        error.innerHTML = "NISN wajib diisi!";
        return;
    }

    // validasi angka
    if(!/^\d+$/.test(nisn)){
        error.innerHTML = "NISN harus berupa angka!";
        return;
    }

    error.innerHTML = "";
    btn.innerText = "Memproses...";

    try {
        let res = await fetch("https://script.google.com/macros/s/AKfycbz2Ea8ohJhB20hWrTrYW6b7wAMwGIE-RWO75YwMsQLdkanCFQOkPkokbfStDtmeJtfHfw/exec?nisn=" + nisn);
        let text = await res.text();
        let data = JSON.parse(text);

        if(data.status === "ditemukan"){
            window.location.href = "hasil.html?nisn=" + nisn;
        } else {
            error.innerHTML = "NISN tidak valid!";
            btn.innerText = "Cek Kelulusan";
        }

    } catch(err){
        error.innerHTML = "Terjadi kesalahan koneksi!";
        btn.innerText = "Cek Kelulusan";
        console.log(err);
    }
}
</script>

</body>
</html>
